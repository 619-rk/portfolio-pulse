<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070d" />
  <title>Constellation</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="row title">✦ constellation</div>
    <div class="row"><span class="k">visits</span><span class="v" id="visitor-count">—</span></div>
    <div class="row"><span class="k">places</span><span class="v" id="places-count">—</span></div>
    <div class="row"><span class="k">you</span><span class="v" id="visitor-loc">locating…</span></div>
    <div class="row"><span class="k">edge</span><span class="v" id="edge-colo">—</span></div>
    <button id="hud-compose" class="hud-btn" type="button">✎ leave a message</button>
  </div>

  <!-- Global composer — opens from HUD button. Posts from visitor's city. -->
  <div id="composer-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button id="composer-close" class="modal-close" aria-label="Close">×</button>
      <div class="modal-title">Leave a message from <span id="composer-city">—</span></div>
      <div class="modal-sub">Anyone who clicks your city will read this.</div>
      <textarea id="composer-text" maxlength="140" rows="3" placeholder="140 characters. Say something kind."></textarea>
      <div class="modal-row">
        <span id="composer-hint" class="modal-hint">140 chars · one message per 24h</span>
        <button id="composer-send" type="button">post</button>
      </div>
    </div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <!-- Info panel — slides in when a star is clicked. -->
  <aside id="info" class="hidden" aria-hidden="true">
    <button id="info-close" aria-label="Close">×</button>
    <div id="info-hero" class="hero empty"></div>
    <div class="info-meta">
      <div id="info-city">—</div>
      <div id="info-sub" class="sub">—</div>
    </div>
    <div id="info-body" class="body">
      <div class="loading">reading up…</div>
    </div>
    <a id="info-link" href="#" target="_blank" rel="noopener" hidden>read more →</a>

    <div id="info-messages" class="messages"></div>
  </aside>

  <div id="hint">drag to rotate · click a star</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
