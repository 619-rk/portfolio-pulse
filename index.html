<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070d" />
  <title>Constellation</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="row title">✦ constellation</div>
    <div class="row"><span class="k">visits</span><span class="v" id="visitor-count">—</span></div>
    <div class="row"><span class="k">places</span><span class="v" id="places-count">—</span></div>
    <div class="row"><span class="k">you</span><span class="v" id="visitor-loc">locating…</span></div>
    <div class="row"><span class="k">edge</span><span class="v" id="edge-colo">—</span></div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <!-- Info panel — slides in when a star is clicked. -->
  <aside id="info" class="hidden" aria-hidden="true">
    <button id="info-close" aria-label="Close">×</button>
    <div class="info-meta">
      <div id="info-city">—</div>
      <div id="info-sub" class="sub">—</div>
    </div>
    <div id="info-body" class="body">
      <div class="loading">reading up…</div>
    </div>
    <a id="info-link" href="#" target="_blank" rel="noopener" hidden>read more →</a>
  </aside>

  <div id="hint">drag to rotate · click a star</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
